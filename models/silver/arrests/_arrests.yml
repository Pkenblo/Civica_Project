version: 2

models:
  - name: arrest
    description: >-
      Última fila completa por número de detención. Incremental delete+insert con
      corte global de ingesta. Las edades, la unidad y el cargo del agente describen
      la detención, no el perfil más reciente de la persona.
    columns:
      - name: arrest_number
        description: Número de detención y clave del incremental.
        data_tests: [unique, not_null]
      - name: ingested_at
        description: Fecha de ingesta de la versión publicada y cursor incremental.
        data_tests: [not_null]
      - name: arrest_occurred_date_time
        description: Fecha y hora de la detención publicadas por el origen.
      - name: arrest_registered_at
        description: Fecha y hora de registro de la detención.
      - name: report_id
        description: Informe asociado, si se informa su número.
        data_tests:
          - relationships:
              arguments: {to: "ref('reports')", field: report_id}
      - name: arrest_type_id
        description: Tipo de actuación informado.
        data_tests:
          - relationships:
              arguments: {to: "ref('arrest_types')", field: arrest_type_id}
      - name: agent_key
        description: Agente identificado en esta versión de la detención.
        data_tests:
          - relationships:
              arguments: {to: "ref('agents')", field: agent_key}
      - name: subject_key
        description: Sujeto identificado en esta versión de la detención.
        data_tests:
          - relationships:
              arguments: {to: "ref('subject')", field: subject_key}
      - name: officer_age
        description: Edad del agente publicada para el evento.
      - name: subject_age_range
        description: Tramo de edad del sujeto publicado para el evento.
      - name: officer_squad_at_arrest
        description: Unidad del agente en la fila de origen; puede faltar aunque exista agent_key.
      - name: officer_title_at_arrest
        description: Cargo del agente en la fila de origen, no en su perfil más reciente.
      - name: address_id
        description: Ubicación compartida; UNKNOWN o REDACTED cuando corresponde.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('full_address')", field: address_id}
      - name: police_area_id
        description: Combinación de distrito, sector y beat publicada para el evento.
        data_tests:
          - relationships:
              arguments: {to: "ref('police_add')", field: police_area_id}
      - name: cad_profile_id
        description: Perfil CAD observado; nulo si faltan sus tres atributos.
        data_tests:
          - relationships:
              arguments: {to: "ref('cad_profiles')", field: cad_profile_id}
      - name: crisis_involved
        description: Indicador de crisis; conserva el nulo del origen.
      - name: complaint_involved
        description: Indicador de queja; conserva el nulo del origen.
      - name: force_involved
        description: Indicador de uso de fuerza; conserva el nulo del origen.
      - name: terry_stop
        description: Indicador de Terry stop; conserva el nulo del origen.
      - name: demonstration
        description: Indicador de manifestación; conserva el nulo del origen.

  - name: arrest_offenses
    description: >-
      Una combinación histórica observada de detención y descripción NIBRS no nula.
      No se limita a la última versión de la detención. Solo una coincidencia exacta
      y única de descripción asigna nibrs_key; las excepciones conservan su texto.
      Incremental delete+insert por arrest_offense_id, con corte global de ingesta
      en las observaciones de staging. No elimina cargos por omisión en un lote.
    columns:
      - name: arrest_offense_id
        description: Clave generada sobre arrest_number y nibrs_description de staging.
        data_tests: [unique, not_null]
      - name: arrest_number
        description: Detención a la que pertenece el cargo observado.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('arrest')", field: arrest_number}
      - name: nibrs_key
        description: Referencia NIBRS solo cuando la descripción identifica un único código.
        data_tests:
          - relationships:
              arguments: {to: "ref('nibrs')", field: nibrs_key}
      - name: nibrs_match_status
        description: Resultado de resolver la descripción contra el catálogo NIBRS.
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [matched, ambiguous, unmatched]}
      - name: unresolved_nibrs_description
        description: Descripción normalizada conservada cuando la resolución es ambigua o no hay coincidencia.
      - name: ingested_at
        description: Mayor fecha de ingesta del cargo en el lote elegible y cursor incremental.
        data_tests: [not_null]

  - name: arrest_types
    description: Un tipo de actuación no nulo observado en staging.
    columns:
      - name: arrest_type_id
        description: Clave generada sobre el tipo de actuación normalizado.
        data_tests: [unique, not_null]
      - name: description
        description: Texto normalizado del tipo de actuación; no todos implican custodia física.
        data_tests: [not_null]

  - name: cad_profiles
    description: >-
      Una combinación observada de cierre, tipo inicial y prioridad CAD.
      Admite combinaciones parciales y no representa una llamada individual.
    columns:
      - name: cad_profile_id
        description: Clave generada sobre los tres atributos CAD, distinguiendo los nulos.
        data_tests: [unique, not_null]
      - name: cad_clearance
        description: Cierre CAD informado.
      - name: cad_initial_call_type
        description: Tipo inicial de llamada informado.
      - name: cad_priority
        description: Prioridad CAD informada.
