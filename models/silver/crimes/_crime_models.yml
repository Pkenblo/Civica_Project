version: 2

models:
  - name: offense_categories
    description: Una fila por categoría de delito informada en staging. No es la clasificación NIBRS.
    columns:
      - name: offense_category_id
        data_tests: [not_null, unique]
      - name: offense_category
        data_tests: [not_null, unique]

  - name: offense_subcategories
    description: Una fila por subcategoría informada y su categoría. Si falta la categoría, la referencia queda nula.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [offense_category_id, offense_sub_category]
    columns:
      - name: offense_subcategory_id
        data_tests: [not_null, unique]
      - name: offense_category_id
        data_tests:
          - relationships:
              arguments: {to: "ref('offense_categories')", field: offense_category_id}
      - name: offense_sub_category
        data_tests: [not_null]

  - name: crimes
    columns:
      - name: offense_category_id
        data_tests:
          - relationships:
              arguments: {to: "ref('offense_categories')", field: offense_category_id}
      - name: offense_subcategory_id
        data_tests:
          - relationships:
              arguments: {to: "ref('offense_subcategories')", field: offense_subcategory_id}

unit_tests:
  - name: offense_categories_deduplica_y_excluye_ausencias
    model: offense_categories
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_crimes')
        rows:
          - {offense_id: D1, offense_category: A}
          - {offense_id: D2, offense_category: A}
          - {offense_id: D3, offense_category: null}
          - {offense_id: null, offense_category: B}
    expect:
      rows:
        - {offense_category: A}

  - name: offense_categories_incremental_devuelve_solo_categorias_nuevas
    model: offense_categories
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_crimes')
        rows:
          - {offense_id: D1, offense_category: A}
          - {offense_id: D2, offense_category: B}
          - {offense_id: D3, offense_category: B}
      - input: this
        rows:
          - {offense_category_id: '7fc56270e7a70fa81a5935b72eacbe29', offense_category: A}
    expect:
      rows:
        - {offense_category: B}

  - name: offense_subcategories_distingue_categoria_y_conserva_etiqueta_sin_categoria
    model: offense_subcategories
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_crimes')
        rows:
          - {offense_id: D1, offense_category: A, offense_sub_category: COMPARTIDA}
          - {offense_id: D2, offense_category: A, offense_sub_category: COMPARTIDA}
          - {offense_id: D3, offense_category: B, offense_sub_category: COMPARTIDA}
          - {offense_id: D4, offense_category: null, offense_sub_category: SIN CATEGORIA}
          - {offense_id: D5, offense_category: A, offense_sub_category: null}
          - {offense_id: null, offense_category: B, offense_sub_category: SIN DELITO}
      - input: ref('offense_categories')
        rows:
          - {offense_category_id: CAT_A, offense_category: A}
          - {offense_category_id: CAT_B, offense_category: B}
    expect:
      rows:
        - {offense_category_id: CAT_A, offense_sub_category: COMPARTIDA}
        - {offense_category_id: CAT_B, offense_sub_category: COMPARTIDA}
        - {offense_category_id: null, offense_sub_category: SIN CATEGORIA}

  - name: offense_subcategories_incremental_distingue_etiquetas_por_categoria
    model: offense_subcategories
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_crimes')
        rows:
          - {offense_id: D1, offense_category: A, offense_sub_category: COMPARTIDA}
          - {offense_id: D2, offense_category: B, offense_sub_category: COMPARTIDA}
          - {offense_id: D3, offense_category: null, offense_sub_category: SIN CATEGORIA}
      - input: ref('offense_categories')
        rows:
          - {offense_category_id: CAT_A, offense_category: A}
          - {offense_category_id: CAT_B, offense_category: B}
      - input: this
        rows:
          - {offense_subcategory_id: 'bff69aae4119c36dab3d9cc1b4ee0520', offense_category_id: CAT_A, offense_sub_category: COMPARTIDA}
          - {offense_subcategory_id: '5d7bd548fcc20872b25dc22daa356d0d', offense_category_id: null, offense_sub_category: SIN CATEGORIA}
    expect:
      rows:
        - {offense_category_id: CAT_B, offense_sub_category: COMPARTIDA}
