version: 2

models:
  - name: census_socioeconomic
    description: >
      ACS 2024 5-year (2020–2024): una fila por cp ZCTA del ámbito 981 seleccionado en Staging.
      Tabla estática, excluible con dbt build --exclude tag:static_model; no es incremental.
      Desempata como licenses: ingesta, archivo, lote y atributos de negocio, descendentes
      con NULLS LAST. Las filas completamente idénticas son intercambiables.
      Conserva los marcadores superiores con flags; no son valores exactos para futuros agregados.
      Relación lógica census_socioeconomic.cp = postal_codes.cp por igualdad de código,
      aceptada como aproximación analítica: ZCTA y ZIP no comparten necesariamente límites.
      No hay join, ni se eliminan los códigos del ámbito seleccionado ausentes del catálogo postal local.
      La correspondencia parcial no constituye una FK total; se mide en el análisis
      census_postal_code_coverage en ambos sentidos, sin exigir una cobertura nacional del 100 %.
      No calcular tasas sin comprobar población nula o cero ni agregar medianas como si fueran sumas.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "income_top_coded = coalesce(median_household_income = 250001, false)"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "home_value_top_coded = coalesce(median_home_value = 2000001, false)"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "rent_top_coded = coalesce(median_monthly_rent = 3501, false)"}
    columns:
      - name: cp
        data_type: varchar(5)
        description: >
          Clave ZCTA de cinco dígitos, con ceros iniciales. Relación por código con postal_codes.cp;
          conservar también los códigos sin correspondencia. No se impone un test relationships
          total sobre el catálogo local porque la fuente económica tiene cobertura nacional.
        data_tests:
          - unique
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: "rlike '^[0-9]{5}$'"}
      - {name: zcta_name, data_type: varchar}
      - name: median_household_income
        data_type: number(38,0)
        description: "Ingreso mediano anual por hogar, USD ajustados a 2024; interpretar junto a income_top_coded."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - name: income_margin_of_error
        data_type: number(38,0)
        description: "Margen de error al 90 % del ingreso mediano."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - name: population
        data_type: number(38,0)
        description: "Población estimada; NULL y cero no sirven como denominadores."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - name: median_home_value
        data_type: number(38,0)
        description: "Valor mediano de viviendas ocupadas por propietarios, USD; interpretar junto a home_value_top_coded."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - name: median_monthly_rent
        data_type: number(38,0)
        description: "Alquiler contractual mediano mensual, USD; interpretar junto a rent_top_coded."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - {name: income_top_coded, data_type: boolean, data_tests: [not_null]}
      - {name: home_value_top_coded, data_type: boolean, data_tests: [not_null]}
      - {name: rent_top_coded, data_type: boolean, data_tests: [not_null]}
      - {name: ingested_at, data_type: timestamp_ntz, description: "Timestamp nativo de ingesta de RAW.", data_tests: [not_null]}
      - {name: source_file, data_type: varchar}
      - {name: batch_id, data_type: varchar}

unit_tests:
  - name: census_zcta_selecciona_ultima_fila_y_desempata_por_cp
    model: census_socioeconomic
    given:
      - input: ref('stg_census_socioeconomic')
        rows:
          - {cp: '98101', ingested_at: '2026-01-01 00:00:00', source_file: z.json, population: 999}
          - {cp: '98101', ingested_at: '2026-01-02 00:00:00', source_file: a.json, population: 1}
          - {cp: '98101', ingested_at: '2026-01-02 00:00:00', source_file: b.json, batch_id: a, population: 2}
          - {cp: '98101', ingested_at: '2026-01-02 00:00:00', source_file: b.json, batch_id: b, population: 3}
          - {cp: '98101', ingested_at: '2026-01-02 00:00:00', source_file: b.json, batch_id: b, population: 4}
          - {cp: '00601', ingested_at: '2026-01-01 00:00:00', population: 0}
          - {cp: '00601', ingested_at: null, population: 100}
          - {cp: '98195', ingested_at: null, population: 2757}
          - {cp: null, ingested_at: '2026-01-01 00:00:00', population: 100}
    expect:
      rows:
        - {cp: '98101', ingested_at: '2026-01-02 00:00:00', source_file: b.json, batch_id: b, population: 4}
        - {cp: '00601', ingested_at: '2026-01-01 00:00:00', source_file: null, batch_id: null, population: 0}
        - {cp: '98195', ingested_at: null, source_file: null, batch_id: null, population: 2757}
