version: 2

models:
  - name: reports
    description: Informe identificable desde delitos o detenciones. La fecha procede de delitos.
    columns:
      - {name: report_id, data_tests: [unique, not_null]}
      - name: report_number
        data_tests:
          - unique
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: "rlike '^[0-9]{4}-[0-9]{6}$'"}

  - name: agents
    description: Último perfil observado por identificador de agente, sin edad del evento.
    columns:
      - {name: agent_key, data_tests: [unique, not_null]}
      - {name: officer_id, data_tests: [unique, not_null]}

  - name: subject
    description: Último perfil observado por identificador de sujeto informado.
    columns:
      - {name: subject_key, data_tests: [unique, not_null]}
      - {name: sk_person, data_tests: [unique, not_null]}

  - name: arrest_types
    description: Tipos de detención observados en staging.
    columns:
      - {name: arrest_type_id, data_tests: [unique, not_null]}
      - {name: description, data_tests: [unique, not_null]}

  - name: cad_profiles
    description: Combinaciones observadas de cierre, tipo inicial y prioridad CAD.
    columns:
      - {name: cad_profile_id, data_tests: [unique, not_null]}

  - name: police_add
    description: Combinación publicada de distrito, sector y beat, incluso parcial.
    columns:
      - {name: police_area_id, data_tests: [unique, not_null]}

  - name: postal_codes
    description: CP de la cartografía activa o de las licencias; geometría opcional.
    columns:
      - {name: cp, data_tests: [unique, not_null]}

  - name: full_address
    description: Ubicación publicada con contexto de calidad y asignación postal en el mapa activo.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "(cp_status = 'matched') = (cp is not null)"}
    columns:
      - {name: address_id, data_tests: [unique, not_null]}
      - name: cp
        data_tests:
          - relationships: {arguments: {to: "ref('postal_codes')", field: cp}}
      - name: cp_status
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [matched, redacted, missing_coordinates, invalid_coordinates, no_match, ambiguous, boundary]}

  - name: nibrs
    description: Última clasificación recibida por código NIBRS, independiente de las categorías de Seattle.
    columns:
      - {name: nibrs_key, data_tests: [unique, not_null]}
      - {name: offense_code, data_tests: [unique, not_null]}

  - name: offense_categories
    columns:
      - {name: offense_category_id, data_tests: [unique, not_null]}
      - {name: offense_category, data_tests: [unique, not_null]}

  - name: offense_subcategories
    description: Una etiqueta dentro de su categoría de origen (si se conoce).
    columns:
      - {name: offense_subcategory_id, data_tests: [unique, not_null]}
      - {name: offense_sub_category, data_tests: [not_null]}
      - name: offense_category_id
        data_tests:
          - relationships: {arguments: {to: "ref('offense_categories')", field: offense_category_id}}

  - name: shooting_types
    columns:
      - {name: shooting_type_id, data_tests: [unique, not_null]}
      - {name: description, data_tests: [unique, not_null]}

  - name: crimes
    description: Última fila de negocio por informe y delito, sin sus etiquetas de tiroteo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [report_id, offense_id]}
      - dbt_utils.expression_is_true:
          arguments: {expression: "crime_id = md5(report_id || '|' || offense_id)"}
    columns:
      - {name: crime_id, data_tests: [unique, not_null]}
      - {name: offense_id, data_tests: [not_null]}
      - {name: ingested_at, data_tests: [not_null]}
      - name: report_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('reports')", field: report_id}}
      - name: nibrs_key
        data_tests:
          - relationships: {arguments: {to: "ref('nibrs')", field: nibrs_key}}
      - name: offense_category_id
        data_tests:
          - relationships: {arguments: {to: "ref('offense_categories')", field: offense_category_id}}
      - name: offense_subcategory_id
        data_tests:
          - relationships: {arguments: {to: "ref('offense_subcategories')", field: offense_subcategory_id}}
      - name: address_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('full_address')", field: address_id}}
      - name: police_area_id
        data_tests:
          - relationships: {arguments: {to: "ref('police_add')", field: police_area_id}}

  - name: arrest
    description: Última fila completa por número de detención. Las edades corresponden al evento.
    columns:
      - {name: arrest_number, data_tests: [unique, not_null]}
      - {name: ingested_at, data_tests: [not_null]}
      - name: report_id
        data_tests:
          - relationships: {arguments: {to: "ref('reports')", field: report_id}}
      - name: arrest_type_id
        data_tests:
          - relationships: {arguments: {to: "ref('arrest_types')", field: arrest_type_id}}
      - name: agent_key
        data_tests:
          - relationships: {arguments: {to: "ref('agents')", field: agent_key}}
      - name: subject_key
        data_tests:
          - relationships: {arguments: {to: "ref('subject')", field: subject_key}}
      - name: cad_profile_id
        data_tests:
          - relationships: {arguments: {to: "ref('cad_profiles')", field: cad_profile_id}}
      - name: address_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('full_address')", field: address_id}}
      - name: police_area_id
        data_tests:
          - relationships: {arguments: {to: "ref('police_add')", field: police_area_id}}

  - name: arrest_offenses
    description: Cargos observados; una descripción NIBRS no es un código NIBRS.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [arrest_number, offense_type, nibrs_description]}
    columns:
      - {name: arrest_offense_id, data_tests: [unique, not_null]}
      - name: arrest_number
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('arrest')", field: arrest_number}}

  - name: crime_shooting_types
    description: Asociación observada entre delito y tipo de tiroteo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [crime_id, shooting_type_id]}
    columns:
      - name: crime_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('crimes')", field: crime_id}}
      - name: shooting_type_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('shooting_types')", field: shooting_type_id}}

  - name: licenses
    description: Una licencia vigente por número; el CP procede de licencias, no del cruce espacial.
    columns:
      - {name: license_number, data_tests: [unique, not_null]}
      - {name: license_id, data_tests: [unique, not_null]}
      - {name: ingested_at, data_tests: [not_null]}
      - name: cp
        data_tests:
          - relationships: {arguments: {to: "ref('postal_codes')", field: cp}}
