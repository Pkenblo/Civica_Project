version: 2

models:
  - name: mart_cp_crimes_pets
    description: Delitos ocurridos y licencias expedidas en el mismo CP y año, agregados independientemente.
    data_tests:
      - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [cp, year]}}
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              coalesce(total_crimes >= 0 and total_licenses_issued >= 0
              and least(dog_licenses_issued, cat_licenses_issued, other_species_licenses_issued, unknown_species_licenses_issued) >= 0
              and total_licenses_issued = dog_licenses_issued + cat_licenses_issued + other_species_licenses_issued + unknown_species_licenses_issued
              and has_crime_records = (total_crimes > 0)
              and has_license_records = (total_licenses_issued > 0)
              and (has_crime_records or has_license_records)
              and equal_null(crimes_per_1000_licenses_issued,
                             1000.0 * total_crimes / nullif(total_licenses_issued, 0)), false)
    columns:
      - name: cp
        data_tests:
          - not_null
          - relationships: {arguments: {to: "ref('dim_postal_codes')", field: cp}}
      - {name: year, data_tests: [not_null]}
      - {name: total_crimes, description: Delitos con CP asignado y fecha de ocurrencia en el año.}
      - {name: total_licenses_issued, description: Registros de licencia con CP y fecha de expedición en el año.}
      - {name: other_species_licenses_issued, description: Especies informadas distintas de perro y gato.}
      - {name: unknown_species_licenses_issued, description: Especie ausente o desconocida; no equivale a otra especie.}
      - {name: has_crime_records, description: Existe al menos un delito observado con el CP y año.}
      - {name: has_license_records, description: Existe al menos una licencia expedida observada con el CP y año.}
      - {name: has_geography, description: El CP tiene geometría en la cartografía activa.}
      - {name: crimes_per_1000_licenses_issued, description: Ratio descriptiva; nula si no hay licencias. No es una tasa poblacional.}

  - name: mart_cp_crimes_pets_severity
    description: Primer mart con desglose de gravedad analítica; conserva los delitos sin clasificar y las zonas solo con licencias.
    data_tests:
      - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [cp, year]}}
      - dbt_utils.equal_rowcount: {arguments: {compare_model: "ref('mart_cp_crimes_pets')"}}
      - dbt_utils.equality:
          arguments:
            compare_model: "ref('mart_cp_crimes_pets')"
            compare_columns: [cp, year, total_crimes, total_licenses_issued, dog_licenses_issued, cat_licenses_issued, other_species_licenses_issued, unknown_species_licenses_issued, has_crime_records, has_license_records, has_geography, boundary_version, crimes_per_1000_licenses_issued]
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              coalesce(least(serious_crimes, minor_crimes, unclassified_crimes) >= 0
              and total_crimes = serious_crimes + minor_crimes + unclassified_crimes
              and equal_null(pct_serious_of_classified, 100.0 * serious_crimes / nullif(serious_crimes + minor_crimes, 0))
              and equal_null(pct_minor_of_classified, 100.0 * minor_crimes / nullif(serious_crimes + minor_crimes, 0))
              and equal_null(pct_severity_coverage, 100.0 * (serious_crimes + minor_crimes) / nullif(total_crimes, 0)), false)
    columns:
      - {name: cp, data_tests: [not_null]}
      - {name: year, data_tests: [not_null]}
      - {name: pct_serious_of_classified, description: 100 × graves / (graves + leves); nulo sin delitos clasificados.}
      - {name: pct_minor_of_classified, description: 100 × leves / (graves + leves); nulo sin delitos clasificados.}
      - {name: pct_severity_coverage, description: 100 × delitos clasificados / delitos totales; nulo sin delitos.}
