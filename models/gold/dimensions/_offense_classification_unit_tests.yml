version: 2

unit_tests:
  - name: dim_offense_classification_conserva_niveles_parciales
    description: Publica las combinaciones de Silver con la misma clave, sin añadir categorías sin subcategoría que no se hayan observado.
    model: dim_offense_classification
    given:
      - input: ref('offense_categories')
        rows:
          - {offense_category_id: C1, offense_category: PERSON, offense_sub_category: OTHER}
          - {offense_category_id: C2, offense_category: PROPERTY, offense_sub_category: OTHER}
          - {offense_category_id: C3, offense_category: null, offense_sub_category: UNKNOWN}
          - {offense_category_id: C4, offense_category: PERSON, offense_sub_category: null}
          - {offense_category_id: C5, offense_category: SOCIETY, offense_sub_category: null}
    expect:
      rows:
        - {offense_classification_id: C1, offense_category: PERSON, offense_sub_category: OTHER}
        - {offense_classification_id: C2, offense_category: PROPERTY, offense_sub_category: OTHER}
        - {offense_classification_id: C3, offense_category: null, offense_sub_category: UNKNOWN}
        - {offense_classification_id: C4, offense_category: PERSON, offense_sub_category: null}
        - {offense_classification_id: C5, offense_category: SOCIETY, offense_sub_category: null}
