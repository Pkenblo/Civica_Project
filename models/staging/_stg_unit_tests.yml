version: 2

unit_tests:
  - name: stg_crimes_normaliza_areas_sin_deduplicar
    description: >
      Comprueba la normalización de áreas policiales y marcadores nulos, y la detección
      de direcciones ocultadas. Las direcciones visibles pasan a mayúsculas y se conservan duplicados.
    model: stg_crimes
    given:
      - input: source('brz_crimes', 'crimes')
        rows:
          - {OFFENSE_ID: C1, PRECINCT: ' North ', SECTOR: ' j ', BEAT: ' j1 ', BLOCK_ADDRESS: 'Marion St / 4th Ave'}
          - {OFFENSE_ID: C1, PRECINCT: ' North ', SECTOR: ' j ', BEAT: ' j1 ', BLOCK_ADDRESS: 'Marion St / 4th Ave'}
          - {OFFENSE_ID: C2, PRECINCT: '-', SECTOR: ' ', BEAT: null, BLOCK_ADDRESS: redacted}
    expect:
      rows:
        - {offense_id: C1, precinct: NORTH, sector: J, beat: J1, block_address: 'MARION ST / 4TH AVE', is_location_redacted: false}
        - {offense_id: C1, precinct: NORTH, sector: J, beat: J1, block_address: 'MARION ST / 4TH AVE', is_location_redacted: false}
        - {offense_id: C2, precinct: null, sector: null, beat: null, block_address: null, is_location_redacted: true}

  - name: stg_arrests_normaliza_tipos_y_areas_sin_deduplicar
    description: >
      Comprueba mayúsculas y espacios exteriores en áreas, y espacios internos, tabulaciones
      y saltos de línea en tipos de arresto. Normaliza marcadores a NULL y conserva las filas repetidas.
    model: stg_arrests
    given:
      - input: source('brz_arrests', 'arrests')
        rows:
          - {ARREST_NUMBER: A1, ARREST_TYPE: ' Physical   Arrest ', PRECINCT: ' North ', SECTOR: ' j ', BEAT: ' j1 '}
          - {ARREST_NUMBER: A1, ARREST_TYPE: "\tphysical\tarrest\n", PRECINCT: NORTH, SECTOR: J, BEAT: J1}
          - {ARREST_NUMBER: A2, ARREST_TYPE: '-', PRECINCT: null, SECTOR: '-', BEAT: ' '}
          - {ARREST_NUMBER: A3, ARREST_TYPE: "\t\n ", PRECINCT: null, SECTOR: null, BEAT: null}
    expect:
      rows:
        - {arrest_number: A1, arrest_type: PHYSICAL ARREST, precinct: NORTH, sector: J, beat: J1}
        - {arrest_number: A1, arrest_type: PHYSICAL ARREST, precinct: NORTH, sector: J, beat: J1}
        - {arrest_number: A2, arrest_type: null, precinct: null, sector: null, beat: null}
        - {arrest_number: A3, arrest_type: null, precinct: null, sector: null, beat: null}

  - name: stg_pet_licenses_normaliza_textos_sin_cambiar_identificadores_ni_cp
    description: >
      Comprueba mayúsculas y espacios exteriores en nombres, especies y razas, y vacíos convertidos a NULL.
      Conserva duplicados, identificadores y CP, incluidos ceros iniciales y códigos inválidos.
    model: stg_pet_licenses
    given:
      - input: source('brz_pet_licenses', 'pet_licenses')
        rows:
          - {LICENSE_NUMBER: l1, ANIMAL_S_NAME: Luna, SPECIES: ' Dog ', PRIMARY_BREED: ' Mixed ', SECONDARY_BREED: ' Terrier ', ZIP_CODE: '00501'}
          - {LICENSE_NUMBER: l1, ANIMAL_S_NAME: Luna, SPECIES: DOG, PRIMARY_BREED: MIXED, SECONDARY_BREED: TERRIER, ZIP_CODE: '00501'}
          - {LICENSE_NUMBER: l2, ANIMAL_S_NAME: Sol, SPECIES: Cat, PRIMARY_BREED: Mixed, SECONDARY_BREED: ' ', ZIP_CODE: '9810'}
          - {LICENSE_NUMBER: l3, ANIMAL_S_NAME: null, SPECIES: ' ', PRIMARY_BREED: null, SECONDARY_BREED: null, ZIP_CODE: null}
    expect:
      rows:
        - {license_number: l1, animal_name: LUNA, species: DOG, primary_breed: MIXED, secondary_breed: TERRIER, zip_code: '00501'}
        - {license_number: l1, animal_name: LUNA, species: DOG, primary_breed: MIXED, secondary_breed: TERRIER, zip_code: '00501'}
        - {license_number: l2, animal_name: SOL, species: CAT, primary_breed: MIXED, secondary_breed: null, zip_code: '9810'}
        - {license_number: l3, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: null}

  - name: stg_crimes_normaliza_descripciones_y_conserva_trazabilidad
    description: >
      Comprueba las mayúsculas en categorías, descripciones NIBRS y barrio.
      Conserva la escritura de identificadores, archivos y lotes de origen.
    model: stg_crimes
    given:
      - input: source('brz_crimes', 'crimes')
        rows:
          - REPORT_NUMBER: report-a
            OFFENSE_ID: offense-a
            NIBRS_GROUP_A_B: ' a '
            NIBRS_CRIME_AGAINST_CATEGORY: ' Person '
            OFFENSE_SUB_CATEGORY: ' Assault '
            SHOOTING_TYPE_GROUP: ' Non Fatal '
            NEIGHBORHOOD: ' Downtown '
            OFFENSE_CATEGORY: ' Assault Offenses '
            NIBRS_OFFENSE_CODE_DESCRIPTION: ' Simple Assault '
            NIBRS_OFFENSE_CODE: ' 13a '
            _SOURCE_FILE: Folder/Crimes.csv
            _BATCH_ID: batch-a
    expect:
      rows:
        - report_number: report-a
          offense_id: offense-a
          nibrs_group_a_b: A
          nibrs_crime_against_category: PERSON
          offense_sub_category: ASSAULT
          shooting_type_group: NON FATAL
          neighborhood: DOWNTOWN
          offense_category: ASSAULT OFFENSES
          nibrs_offense_code_description: SIMPLE ASSAULT
          nibrs_offense_code: 13A
          source_file: Folder/Crimes.csv
          batch_id: batch-a

  - name: stg_arrests_normaliza_descripciones_y_marcadores_demograficos
    description: >
      Comprueba mayúsculas en textos operativos, infracciones, datos demográficos y ubicaciones.
      Convierte el marcador - de los campos demográficos en NULL sin alterar los identificadores.
    model: stg_arrests
    given:
      - input: source('brz_arrests', 'arrests')
        rows:
          - ARREST_NUMBER: arrest-a
            OFFICER_ID: officer-a
            REPORT_NUMBER: report-a
            SK_PERSON: person-a
            CAD_CLEARANCE: ' Arrest Made '
            CAD_INITIAL_CALL_TYPE: ' Disturbance '
            NIBRS_DESCRIPTION: ' Simple Assault '
            OFFENSE_TYPE: ' Assault '
            OFFICER_GENDER: ' Male '
            OFFICER_RACE: ' White '
            AS_ON_SQUAD_DESC: ' Patrol '
            INV_OFFICER_TITLE: ' Officer '
            SUBJECT_AGE_RANGE: ' Adult '
            SUBJECT_GENDER: ' Female '
            SUBJECT_RACE: ' Asian '
            BLOCK_ADDRESS: ' Marion St / 4th Ave '
            NEIGHBORHOOD: ' Downtown '
          - {ARREST_NUMBER: arrest-b, OFFICER_GENDER: '-', OFFICER_RACE: '-', SUBJECT_AGE_RANGE: '-', SUBJECT_GENDER: '-', SUBJECT_RACE: '-'}
    expect:
      rows:
        - arrest_number: arrest-a
          officer_id: officer-a
          report_number: report-a
          subject_id: person-a
          cad_clearance: ARREST MADE
          cad_initial_call_type: DISTURBANCE
          nibrs_description: SIMPLE ASSAULT
          offense_type: ASSAULT
          officer_gender: MALE
          officer_race: WHITE
          officer_squad: PATROL
          officer_title: OFFICER
          subject_age_range: ADULT
          subject_gender: FEMALE
          subject_race: ASIAN
          block_address: MARION ST / 4TH AVE
          neighborhood: DOWNTOWN
        - {arrest_number: arrest-b, officer_id: null, report_number: null, subject_id: null, cad_clearance: null, cad_initial_call_type: null, nibrs_description: null, offense_type: null, officer_gender: null, officer_race: null, officer_squad: null, officer_title: null, subject_age_range: null, subject_gender: null, subject_race: null, block_address: null, neighborhood: null}

  - name: stg_zipcode_areas_normaliza_textos_y_conserva_version_y_procedencia
    description: >
      Comprueba las mayúsculas en atributos postales extraídos del VARIANT.
      Conserva ceros iniciales del CP y la escritura de la versión cartográfica, archivo y lote.
    model: stg_zipcode_areas
    given:
      - input: source('brz_zipcode_areas', 'zipcode_areas')
        format: sql
        rows: |
          select
              parse_json('{"properties":{"OBJECTID":1,"ZIPCODE":"00501","ZIP_TYPE":" Standard ","COUNTY_NAME":" King ","PREFERRED_CITY":" Seattle "}}') as feature,
              'kc_v1'::varchar as boundary_version,
              null::timestamp_ltz as _ingested_at,
              'Folder/Map.geojson'::varchar as _source_file,
              'batch-a'::varchar as _batch_id
    expect:
      rows:
        - {object_id: 1, zip_code: '00501', zip_type: STANDARD, county_name: KING, preferred_city: SEATTLE, boundary_version: kc_v1, source_file: Folder/Map.geojson, batch_id: batch-a}

  - name: stg_crimes_conserva_formato_y_ceros_del_numero_de_informe
    description: >
      Comprueba que el informe de delitos ya usa YYYY-NNNNNN, conserva ceros iniciales
      y elimina espacios exteriores. No inventa números para nulos.
    model: stg_crimes
    given:
      - input: source('brz_crimes', 'crimes')
        rows:
          - {REPORT_NUMBER: ' 2026-000001 '}
          - {REPORT_NUMBER: '2026-912738'}
          - {REPORT_NUMBER: null}
    expect:
      rows:
        - {report_number: '2026-000001'}
        - {report_number: '2026-912738'}
        - {report_number: null}

  - name: stg_arrests_normaliza_informes_solo_con_el_patron_aprobado
    description: >
      Comprueba la conversión de YYYY0000NNNNNN a YYYY-NNNNNN sin perder ceros iniciales.
      Los formatos distintos se conservan, no se recortan por suposición.
    model: stg_arrests
    given:
      - input: source('brz_arrests', 'arrests')
        rows:
          - {REPORT_NUMBER: ' 20260000912738 '}
          - {REPORT_NUMBER: '20260000000001'}
          - {REPORT_NUMBER: '2026-123456'}
          - {REPORT_NUMBER: '20261234123456'}
          - {REPORT_NUMBER: null}
    expect:
      rows:
        - {report_number: '2026-912738'}
        - {report_number: '2026-000001'}
        - {report_number: '2026-123456'}
        - {report_number: '20261234123456'}
        - {report_number: null}
