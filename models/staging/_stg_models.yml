# _stg_models.yml
# Configura, documenta y valida las vistas de staging en BRONZE.STG.

version: 2

models:

  #################STG_PET_LICENSES##############
  - name: stg_pet_licenses

    config:
      materialized: view
      database: "{{ env_var('DBT_BRONZE') }}"
      schema: STG

    description: >
      Licencias de mascotas con nombres y tipos normalizados.
      Nombres, especies, razas y CP en mayúsculas, sin espacios exteriores ni cadenas vacías.
      El identificador de licencia y los metadatos conservan su escritura de origen.
      Conserva los registros del origen sin deduplicar.

    columns:
      - name: license_issue_date
        data_type: date
        description: Fecha de emisión de la licencia.
        data_tests:
          - not_null

      - name: license_number
        data_type: varchar
        description: Identificador de la licencia.
        data_tests:
          - not_null

      - name: animal_name
        data_type: varchar
        description: Nombre de la mascota en mayúsculas, sin espacios exteriores.

      - name: species
        data_type: varchar
        description: Especie de la mascota en mayúsculas, sin espacios exteriores.
        data_tests:
          - not_null

      - name: primary_breed
        data_type: varchar
        description: Raza principal de la mascota en mayúsculas, sin espacios exteriores.
        data_tests:
          - not_null

      - name: secondary_breed
        data_type: varchar
        description: Raza secundaria en mayúsculas y sin espacios exteriores, cuando está informada.

      - name: zip_code
        data_type: varchar
        description: Código postal del propietario.

      - name: ingested_at
        data_type: timestamp_ltz
        description: Fecha y hora de carga del registro en RAW.

      - name: source_file
        data_type: varchar
        description: Archivo del que procede el registro.

      - name: batch_id
        data_type: varchar
        description: Identificador de la carga.


  #################STG_CRIMES##############
  - name: stg_crimes

    config:
      materialized: view
      database: "{{ env_var('DBT_BRONZE') }}"
      schema: STG

    description: >
      Registros de delitos con nombres, tipos y marcadores normalizados.
      Textos descriptivos y códigos en mayúsculas, sin espacios exteriores ni cadenas vacías.
      Los identificadores y los metadatos conservan su escritura de origen.
      Conserva las versiones y las filas asociadas a distintos tipos de tiroteo.

    columns:
      - name: report_number
        data_type: varchar
        description: Número de informe policial YYYY-NNNNNN, ya en formato común en el origen de delitos.
        data_tests:
          - not_null

      - name: report_date_time
        data_type: timestamp_ntz
        description: Fecha y hora de registro del informe, sin conversión de zona horaria.
        data_tests:
          - not_null

      - name: offense_id
        data_type: varchar
        description: Identificador del delito concreto, que puede aparecer en varias filas.
        data_tests:
          - not_null

      - name: offense_date
        data_type: timestamp_ntz
        description: Fecha y hora del delito, sin conversión de zona horaria.
        data_tests:
          - not_null

      - name: nibrs_group_a_b
        data_type: varchar
        description: Grupo A o B de la clasificación NIBRS.

      - name: nibrs_crime_against_category
        data_type: varchar
        description: Categoría NIBRS según aquello contra lo que se dirige el delito.

      - name: offense_sub_category
        data_type: varchar
        description: Subcategoría del delito publicada por el origen.

      - name: shooting_type_group
        data_type: varchar
        description: Clasificación del tiroteo cuando está informada.

      - name: block_address
        data_type: varchar
        description: Dirección aproximada a nivel de bloque; NULL si está vacía u ocultada.

      - name: latitude
        data_type: number(18,5)
        description: Latitud publicada; NULL si no es convertible o contiene el marcador -1.

      - name: longitude
        data_type: number(18,5)
        description: Longitud publicada; NULL si no es convertible o contiene el marcador -1.

      - name: beat
        data_type: varchar
        description: Código de la zona de patrulla policial en mayúsculas, sin espacios exteriores.

      - name: precinct
        data_type: varchar
        description: Distrito policial en mayúsculas, sin espacios exteriores.

      - name: sector
        data_type: varchar
        description: Sector policial en mayúsculas, sin espacios exteriores.

      - name: neighborhood
        data_type: varchar
        description: Barrio publicado por el origen.

      - name: reporting_area
        data_type: varchar
        description: Código del área de reporte; NULL si está vacío u ocultado.

      - name: offense_category
        data_type: varchar
        description: Categoría del delito publicada por el origen.
        data_tests:
          - not_null

      - name: nibrs_offense_code_description
        data_type: varchar
        description: Descripción del código de delito NIBRS.

      - name: nibrs_offense_code
        data_type: varchar
        description: Código del delito en la clasificación NIBRS.

      - name: census_block_2020
        data_type: varchar
        description: Referencia censal de 2020 en el formato publicado por el origen.

      - name: is_location_redacted
        data_type: boolean
        description: Indica si la dirección, latitud o longitud contienen REDACTED en el origen.

      - name: ingested_at
        data_type: timestamp_ltz
        description: Fecha y hora de carga del registro en RAW.

      - name: source_file
        data_type: varchar
        description: Archivo del que procede el registro.

      - name: batch_id
        data_type: varchar
        description: Identificador de la carga.


  #################STG_ARRESTS##############
  - name: stg_arrests

    config:
      materialized: view
      database: "{{ env_var('DBT_BRONZE') }}"
      schema: STG

    description: >
      Registros de detenciones con nombres, tipos y marcadores normalizados.
      Textos descriptivos y códigos en mayúsculas, sin espacios exteriores ni cadenas vacías.
      Los identificadores y los metadatos conservan su escritura de origen.
      Conserva las versiones y las filas asociadas a diferentes infracciones.

    columns:
      - name: arrest_number
        data_type: varchar
        description: Identificador del registro de detención, que puede aparecer en varias filas.
        data_tests:
          - not_null

      - name: arrest_occurred_date_time
        data_type: timestamp_ntz
        description: Fecha y hora de la detención, sin conversión de zona horaria.
        data_tests:
          - not_null

      - name: arrest_reported_date_time
        data_type: timestamp_ntz
        description: Fecha y hora de registro de la detención, sin conversión de zona horaria.
        data_tests:
          - not_null

      - name: arrest_type
        data_type: varchar
        description: >
          Tipo de actuación en mayúsculas, sin espacios exteriores y con espacios internos unificados.
          Puede incluir citaciones o actuaciones sin ingreso en prisión.
        data_tests:
          - not_null

      - name: beat
        data_type: varchar
        description: Código de la zona de patrulla policial en mayúsculas, sin espacios exteriores.

      - name: cad_clearance
        data_type: varchar
        description: Clasificación de cierre del incidente en el sistema de despacho CAD.

      - name: cad_initial_call_type
        data_type: varchar
        description: Tipo inicial de llamada registrado en CAD.

      - name: cad_priority
        data_type: number(38,0)
        description: Prioridad registrada en CAD; NULL cuando contiene el marcador -1.

      - name: crisis_involved
        data_type: boolean
        description: Indica si el registro señala una situación de crisis.

      - name: complaint_involved
        data_type: boolean
        description: Indica si el registro señala una queja asociada.

      - name: force_involved
        data_type: boolean
        description: Indica si el registro señala uso de la fuerza.

      - name: nibrs_description
        data_type: varchar
        description: Descripción NIBRS asociada a la infracción de esta fila.

      - name: offense_type
        data_type: varchar
        description: Descripción de la infracción legal asociada a la detención.

      - name: officer_age
        data_type: number(38,0)
        description: Edad del agente registrada en el origen; NULL cuando contiene el marcador -1.

      - name: officer_gender
        data_type: varchar
        description: Género del agente según el origen.

      - name: officer_id
        data_type: varchar
        description: Identificador del agente; puede faltar en una versión de RAW.

      - name: officer_race
        data_type: varchar
        description: Clasificación racial del agente según el origen.

      - name: officer_squad
        data_type: varchar
        description: Descripción de la unidad del agente.

      - name: officer_title
        data_type: varchar
        description: Cargo o rango del agente.

      - name: precinct
        data_type: varchar
        description: Distrito policial en mayúsculas, sin espacios exteriores.

      - name: report_number
        data_type: varchar
        description: >
          Número de informe común con delitos. Solo transforma YYYY0000NNNNNN en YYYY-NNNNNN.
          Los demás formatos se conservan para revisión; Reports comprueba el formato esperado.
        data_tests:
          - not_null

      - name: sector
        data_type: varchar
        description: Sector policial en mayúsculas, sin espacios exteriores.

      - name: subject_age_range
        data_type: varchar
        description: Rango de edad del sujeto en mayúsculas; NULL si está vacío o contiene el marcador -.

      - name: subject_gender
        data_type: varchar
        description: Género del sujeto en mayúsculas; NULL si está vacío o contiene el marcador -.

      - name: subject_id
        data_type: varchar
        description: Identificador del sujeto; NULL cuando contiene el marcador -1.

      - name: subject_race
        data_type: varchar
        description: Clasificación racial del sujeto en mayúsculas; NULL si está vacía o contiene el marcador -.

      - name: terry_stop
        data_type: boolean
        description: Indica si el registro señala una parada de investigación Terry Stop.

      - name: block_address
        data_type: varchar
        description: Dirección aproximada a nivel de bloque; NULL si está vacía u ocultada.

      - name: latitude
        data_type: number(18,5)
        description: Latitud publicada; NULL si no es convertible o contiene el marcador -1.

      - name: longitude
        data_type: number(18,5)
        description: Longitud publicada; NULL si no es convertible o contiene el marcador -1.

      - name: neighborhood
        data_type: varchar
        description: Barrio publicado por el origen.

      - name: reporting_area
        data_type: varchar
        description: Código del área de reporte; NULL si está vacío u ocultado.

      - name: demonstration
        data_type: boolean
        description: Indica si el registro está relacionado con una manifestación.

      - name: census_block_2020
        data_type: varchar
        description: Referencia censal de 2020 en el formato publicado por el origen.

      - name: is_location_redacted
        data_type: boolean
        description: Indica si la dirección, latitud o longitud contienen REDACTED en el origen.

      - name: ingested_at
        data_type: timestamp_ltz
        description: Fecha y hora de carga del registro en RAW.

      - name: source_file
        data_type: varchar
        description: Archivo del que procede el registro.

      - name: batch_id
        data_type: varchar
        description: Identificador de la carga.


  #################STG_ZIPCODE_AREAS##############
  - name: stg_zipcode_areas

    config:
      materialized: view
      database: "{{ env_var('DBT_BRONZE') }}"
      schema: STG

    description: >
      Zonas postales de King County y alrededores con atributos y geometría tipados.
      Textos descriptivos y CP en mayúsculas, sin espacios exteriores ni cadenas vacías.
      La versión cartográfica y los metadatos conservan su escritura de origen.
      Conserva una fila por entidad del origen, sin unir piezas ni seleccionar una versión.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - boundary_version
              - object_id

    columns:
      - name: object_id
        data_type: number(38,0)
        description: Identificador de la entidad en la versión cartográfica de origen.
        data_tests:
          - not_null

      - name: zip_code
        data_type: varchar
        description: Código postal como texto. Puede repetirse si tiene varias piezas.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "rlike '^[0-9]{5}$'"

      - name: zip_type
        data_type: varchar
        description: Tipo de código postal según King County.

      - name: county_name
        data_type: varchar
        description: Nombre del condado según la cartografía de origen.

      - name: preferred_city
        data_type: varchar
        description: Ciudad postal preferida según la cartografía de origen.

      - name: geography
        data_type: geography
        description: Geometría de la entidad en Snowflake. Si no se puede convertir, queda nula y falla la prueba.
        data_tests:
          - not_null

      - name: boundary_version
        data_type: varchar
        description: Versión de la descarga cartográfica, no fecha de vigencia de los límites.
        data_tests:
          - not_null

      - name: ingested_at
        data_type: timestamp_ltz
        description: Fecha y hora de carga del registro en RAW.

      - name: source_file
        data_type: varchar
        description: Archivo del que procede el registro.

      - name: batch_id
        data_type: varchar
        description: Identificador de la carga.
