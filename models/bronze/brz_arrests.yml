version: 2

sources:
  - name: brz_arrests
    description: "Registros de detenciones publicados por Seattle Open Data."
    database: "{{ target.name | upper }}_BRONZE"
    schema: RAW

    tables:
      - name: arrests
        identifier: ARRESTS
        description: "Datos originales de detenciones y sus infracciones asociadas, incluyendo las versiones recibidas en las cargas."

        columns:
          - name: ARREST_NUMBER
            data_type: varchar
            description: "Identificador de la detención. Puede repetirse por infracciones asociadas o versiones posteriores."

          - name: ARREST_OCCURRED_DATE_TIME
            data_type: varchar
            description: "Fecha y hora de la detención, en texto."

          - name: ARREST_REPORTED_DATE_TIME
            data_type: varchar
            description: "Fecha y hora de registro de la detención en el sistema, en texto."

          - name: ARREST_TYPE
            data_type: varchar
            description: "Tipo de detención, citación u otra modalidad publicada."

          - name: BEAT
            data_type: varchar
            description: "Zona de patrulla policial donde ocurrió la detención."

          - name: CAD_CLEARANCE
            data_type: varchar
            description: "Resultado o cierre registrado de la llamada policial."

          - name: CAD_INITIAL_CALL_TYPE
            data_type: varchar
            description: "Tipo inicial de llamada o activación policial."

          - name: CAD_PRIORITY
            data_type: varchar
            description: "Código de prioridad de la llamada policial, en texto."

          - name: CRISIS_INVOLVED
            data_type: varchar
            description: "Indicador de asociación con un evento de crisis, expresado como Y o N."

          - name: COMPLAINT_INVOLVED
            data_type: varchar
            description: "Indicador de asociación con un registro de queja, expresado como Y o N."

          - name: FORCE_INVOLVED
            data_type: varchar
            description: "Indicador de asociación con uso de fuerza, expresado como Y o N."

          - name: NIBRS_DESCRIPTION
            data_type: varchar
            description: "Descripción NIBRS publicada en la fila de detención. No implica una equivalencia única con OFFENSE_TYPE."

          - name: OFFENSE_TYPE
            data_type: varchar
            description: "Infracción legal asociada a la detención, con su referencia normativa y descripción."

          - name: OFFICER_AGE
            data_type: varchar
            description: "Edad registrada del agente para el evento, en texto."

          - name: OFFICER_GENDER
            data_type: varchar
            description: "Género registrado del agente."

          - name: OFFICER_ID
            data_type: varchar
            description: "Identificador del agente."

          - name: OFFICER_RACE
            data_type: varchar
            description: "Categoría racial registrada del agente."

          - name: AS_ON_SQUAD_DESC
            data_type: varchar
            description: "Descripción de la unidad o equipo al que estaba asignado el agente."

          - name: INV_OFFICER_TITLE
            data_type: varchar
            description: "Cargo o categoría del agente."

          - name: PRECINCT
            data_type: varchar
            description: "Distrito policial donde ocurrió la detención."

          - name: REPORT_NUMBER
            data_type: varchar
            description: "Número del caso o informe asociado, en el formato original de arrests."

          - name: SECTOR
            data_type: varchar
            description: "Sector policial donde ocurrió la detención."

          - name: SUBJECT_AGE_RANGE
            data_type: varchar
            description: "Intervalo de edad registrado de la persona detenida."

          - name: SUBJECT_GENDER
            data_type: varchar
            description: "Género registrado de la persona detenida."

          - name: SK_PERSON
            data_type: varchar
            description: "Identificador de la persona detenida dentro del sistema de origen."

          - name: SUBJECT_RACE
            data_type: varchar
            description: "Categoría racial registrada de la persona detenida."

          - name: TERRY_STOP
            data_type: varchar
            description: "Indicador de asociación con una parada policial investigativa, expresado como Y o N."

          - name: BLOCK_ADDRESS
            data_type: varchar
            description: "Dirección aproximada de la detención por bloque de calle."

          - name: LATITUDE
            data_type: varchar
            description: "Latitud aproximada, en texto. Puede contener valores marcadores de ubicación no disponible."

          - name: LONGITUDE
            data_type: varchar
            description: "Longitud aproximada, en texto. Puede contener valores marcadores de ubicación no disponible."

          - name: NEIGHBORHOOD
            data_type: varchar
            description: "Barrio o agrupación territorial MCPP donde ocurrió la detención."

          - name: REPORTING_AREA
            data_type: varchar
            description: "Área geográfica de reporte donde ocurrió la detención."

          - name: DEMONSTRATION
            data_type: varchar
            description: "Indicador de etiqueta relacionada con manifestaciones, expresado como Yes o No."

          - name: CENSUS_BLOCK_2020
            data_type: varchar
            description: "Referencia del tracto y bloque censal de 2020, separados por un punto."

          - name: _INGESTED_AT
            data_type: timestamp_ltz
            description: "Fecha y hora de carga en Snowflake."

          - name: _SOURCE_FILE
            data_type: varchar
            description: "Ruta del archivo de origen dentro del stage."

          - name: _BATCH_ID
            data_type: varchar
            description: "Identificador del lote de carga."

          - name: _SOURCE_UPDATED_AT
            data_type: timestamp_tz
            description: "Fecha de modificación en origen, si se proporciona. Actualmente NULL."