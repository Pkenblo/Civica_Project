version: 2

unit_tests:
  - name: stg_pet_licenses_normaliza_textos_y_filtra_prefijo_981
    description: >
      Comprueba mayúsculas y espacios exteriores en nombres, especies y razas, y vacíos convertidos a NULL.
      Convierte UNKNOWN y el guion en NULL para species.
      Conserva duplicados e identificadores y solo admite CP con prefijo 981 tras recortar espacios.
      El filtro por prefijo no valida la longitud del código.
    model: stg_pet_licenses
    given:
      - input: source('brz_pet_licenses', 'pet_licenses')
        rows:
          - {LICENSE_NUMBER: l1, ANIMAL_S_NAME: Luna, SPECIES: ' Dog ', PRIMARY_BREED: ' Mixed ', SECONDARY_BREED: ' Terrier ', ZIP_CODE: ' 98101 '}
          - {LICENSE_NUMBER: l1, ANIMAL_S_NAME: Luna, SPECIES: DOG, PRIMARY_BREED: MIXED, SECONDARY_BREED: TERRIER, ZIP_CODE: '98101'}
          - {LICENSE_NUMBER: l2, ANIMAL_S_NAME: Sol, SPECIES: Cat, PRIMARY_BREED: Mixed, SECONDARY_BREED: ' ', ZIP_CODE: '9810'}
          - {LICENSE_NUMBER: l3, ANIMAL_S_NAME: null, SPECIES: ' ', PRIMARY_BREED: null, SECONDARY_BREED: null, ZIP_CODE: null}
          - {LICENSE_NUMBER: l4, ZIP_CODE: '00501'}
          - {LICENSE_NUMBER: l5, ZIP_CODE: '98001'}
          - {LICENSE_NUMBER: l6, ZIP_CODE: ' '}
          - {LICENSE_NUMBER: l7, SPECIES: ' Unknown ', ZIP_CODE: '98101'}
          - {LICENSE_NUMBER: l8, SPECIES: ' ', ZIP_CODE: '98101'}
          - {LICENSE_NUMBER: l9, SPECIES: null, ZIP_CODE: '98101'}
          - {LICENSE_NUMBER: l10, SPECIES: ' - ', ZIP_CODE: '98101'}
          - {LICENSE_NUMBER: l11, SPECIES: '', ZIP_CODE: '98101'}
    expect:
      rows:
        - {license_number: l1, animal_name: LUNA, species: DOG, primary_breed: MIXED, secondary_breed: TERRIER, zip_code: '98101'}
        - {license_number: l1, animal_name: LUNA, species: DOG, primary_breed: MIXED, secondary_breed: TERRIER, zip_code: '98101'}
        - {license_number: l2, animal_name: SOL, species: CAT, primary_breed: MIXED, secondary_breed: null, zip_code: '9810'}
        - {license_number: l7, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: '98101'}
        - {license_number: l8, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: '98101'}
        - {license_number: l9, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: '98101'}
        - {license_number: l10, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: '98101'}
        - {license_number: l11, animal_name: null, species: null, primary_breed: null, secondary_breed: null, zip_code: '98101'}

  - name: stg_arrests_normaliza_descripciones_y_marcadores_demograficos
    description: >
      Conserva las descripciones originales y convierte el guion demográfico en NULL.
      Convierte solo informes con formato YYYY0000NNNNNN a YYYY-NNNNNN sin perder ceros iniciales.
    model: stg_arrests
    given:
      - input: source('brz_arrests', 'arrests')
        rows:
          - ARREST_NUMBER: arrest-a
            REPORT_NUMBER: '20260000000001'
            NIBRS_DESCRIPTION: ' Simple Assault '
            OFFENSE_TYPE: ' Assault '
            OFFICER_GENDER: ' Male '
            OFFICER_RACE: ' White '
            SUBJECT_AGE_RANGE: ' Adult '
            SUBJECT_GENDER: ' Female '
            SUBJECT_RACE: ' Asian '
          - {ARREST_NUMBER: arrest-b, OFFICER_GENDER: '-', OFFICER_RACE: '-', SUBJECT_AGE_RANGE: '-', SUBJECT_GENDER: '-', SUBJECT_RACE: '-'}
          - {ARREST_NUMBER: arrest-c, REPORT_NUMBER: '20260000912738 '}
          - {ARREST_NUMBER: arrest-d, REPORT_NUMBER: '2026-123456'}
          - {ARREST_NUMBER: arrest-e, REPORT_NUMBER: '20261234123456'}
    expect:
      rows:
        - arrest_number: arrest-a
          report_number: '2026-000001'
          nibrs_description: SIMPLE ASSAULT
          offense_type: ASSAULT
          nibrs_description_original: ' Simple Assault '
          offense_type_original: ' Assault '
          officer_gender: MALE
          officer_race: WHITE
          subject_age_range: ADULT
          subject_gender: FEMALE
          subject_race: ASIAN
        - {arrest_number: arrest-b, report_number: null, nibrs_description: null, offense_type: null,
           nibrs_description_original: null, offense_type_original: null, officer_gender: null, officer_race: null,
           subject_age_range: null, subject_gender: null, subject_race: null}
        - {arrest_number: arrest-c, report_number: '2026-912738', nibrs_description: null, offense_type: null,
           nibrs_description_original: null, offense_type_original: null, officer_gender: null, officer_race: null,
           subject_age_range: null, subject_gender: null, subject_race: null}
        - {arrest_number: arrest-d, report_number: '2026-123456', nibrs_description: null, offense_type: null,
           nibrs_description_original: null, offense_type_original: null, officer_gender: null, officer_race: null,
           subject_age_range: null, subject_gender: null, subject_race: null}
        - {arrest_number: arrest-e, report_number: '20261234123456', nibrs_description: null, offense_type: null,
           nibrs_description_original: null, offense_type_original: null, officer_gender: null, officer_race: null,
           subject_age_range: null, subject_gender: null, subject_race: null}

  - name: stg_crimes_conserva_formato_y_ceros_del_numero_de_informe
    description: >
      Comprueba que el informe de delitos ya usa YYYY-NNNNNN, conserva ceros iniciales
      y elimina espacios exteriores. No inventa números para nulos.
    model: stg_crimes
    given:
      - input: source('brz_crimes', 'crimes')
        rows:
          - {REPORT_NUMBER: ' 2026-000001 '}
          - {REPORT_NUMBER: '2026-912738'}
          - {REPORT_NUMBER: null}
    expect:
      rows:
        - {report_number: '2026-000001'}
        - {report_number: '2026-912738'}
        - {report_number: null}
