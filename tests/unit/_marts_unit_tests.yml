version: 2

unit_tests:
  - name: mart_licencias_usa_el_anio_corregido_del_delito
    model: mart_crimes_pet_licenses
    description: >-
      Tras corregir C1 de 2024 a 2025, cuenta cero robos de vehículos en 2024 y dos en 2025.
      2024 sigue siendo un año común por C3. Conserva los CP sin casos, deduplica las
      etiquetas de tiroteo y acumula licencias anteriores al primer año común.
    given:
      - input: ref('fact_crimes')
        format: sql
        rows: |
          select crime_id, address_id, nibrs_key, offense_date_key
          from values ('C1', 'A1', 'N1', 20250102), ('C2', 'A1', 'N1', 20250102),
                      ('C3', 'A1', 'N2', 20241231)
          as v(crime_id, address_id, nibrs_key, offense_date_key)
      - input: ref('dim_date')
        format: sql
        rows: |
          select date_key, year from values (20241231, 2024), (20250102, 2025) as v(date_key, year)
      - input: ref('dim_licenses')
        format: sql
        rows: |
          select cp, issue_date::date as license_issue_date, species
          from values ('98101', '2023-01-01', 'DOG'), ('98101', '2024-01-01', 'CAT'),
                      ('98101', '2025-01-01', 'DOG')
          as v(cp, issue_date, species)
      - input: ref('dim_address')
        format: sql
        rows: "select 'A1' as address_id, '98101' as cp"
      - input: ref('dim_nibrs')
        format: sql
        rows: |
          select nibrs_key, offense_code from values ('N1', '240'), ('N2', '120') as v(nibrs_key, offense_code)
      - input: ref('bridge_crime_shooting_types')
        format: sql
        rows: |
          select crime_id, shooting_type_id from values ('C3', 'S1'), ('C3', 'S2') as v(crime_id, shooting_type_id)
      - input: ref('dim_postal_codes')
        format: sql
        rows: |
          select cp, cast(null as geography) as geography, cast(null as varchar) as boundary_version
          from values ('98101'), ('98102') as v(cp)
    expect:
      rows:
        - {cp: '98101', year: 2024, vehicle_theft_count: 0, theft_count: 1, shooting_or_homicide_count: 1, pet_license_count: 1, cumulative_dog_license_count: 1, dog_license_share: 0}
        - {cp: '98101', year: 2025, vehicle_theft_count: 2, theft_count: 0, shooting_or_homicide_count: 0, pet_license_count: 1, cumulative_dog_license_count: 2, dog_license_share: 1}
        - {cp: '98102', year: 2024, vehicle_theft_count: 0, theft_count: 0, shooting_or_homicide_count: 0, pet_license_count: 0, cumulative_dog_license_count: 0, dog_license_share: null}
        - {cp: '98102', year: 2025, vehicle_theft_count: 0, theft_count: 0, shooting_or_homicide_count: 0, pet_license_count: 0, cumulative_dog_license_count: 0, dog_license_share: null}
