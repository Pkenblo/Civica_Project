version: 2

unit_tests:
  - name: fact_crimes_filtra_por_ingesta_del_delito
    model: fact_crimes
    description: >-
      Solo pasan los delitos con ingesta estrictamente posterior al corte, aunque
      haya cambiado la fecha del informe de otros delitos. Las filas del lote obtienen
      las claves del calendario, conservan los nulos recibidos y mantienen su ingesta.
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('crimes')
        format: sql
        rows: |
          select crime_id, report_id, crime_id as offense_id, nibrs_key,
                 'A1' as address_id, 'P1' as police_area_id, 'OC1' as offense_category_id,
                 '2026-01-01 08:00:00'::timestamp_ntz as offense_date,
                 ingested_at::timestamp_tz::timestamp_ltz as ingested_at
          from values
              ('C1', 'R1', 'N1', '2026-01-01 12:00:00 +00:00'),
              ('C2', 'R1', 'N1', '2026-01-01 12:00:00 +00:00'),
              ('C3', 'R2', 'N1', '2026-01-02 12:00:00 +00:00'),
              ('C4', 'R3', 'N1', '2026-01-01 12:00:00 +00:00'),
              ('C5', 'R2', 'N1', '2026-01-02 12:00:00 +00:00'),
              ('C6', 'R2', null, '2026-01-03 12:00:00 +00:00'),
              ('C7', 'R1', 'N1', '2026-01-03 12:00:00 +00:00')
          as v(crime_id, report_id, nibrs_key, ingested_at)
      - input: ref('dim_report')
        format: sql
        rows: |
          select report_id, report_date_time::timestamp_ntz as report_date_time,
                 '2026-02-01 12:00:00 +00:00'::timestamp_tz::timestamp_ltz as ingested_at
          from values
              ('R1', null),
              ('R2', '2026-01-05 09:00:00'),
              ('R3', '2026-01-06 10:00:00')
          as v(report_id, report_date_time)
      - input: ref('dim_date')
        format: sql
        rows: |
          select full_date::date as full_date, date_key
          from values ('2026-01-01', 20260101), ('2026-01-05', 20260105), ('2026-01-06', 20260106)
          as v(full_date, date_key)
      - input: this
        format: sql
        rows: |
          select crime_id, report_date_key,
                 ingested_at::timestamp_tz::timestamp_ltz as ingested_at, 'N1' as nibrs_key
          from values
              ('C1', 20260104, '2026-01-01 12:00:00 +00:00'),
              ('C2', 20260104, '2026-01-01 12:00:00 +00:00'),
              ('C3', 20260105, '2026-01-02 12:00:00 +00:00'),
              ('C4', null,     '2026-01-01 12:00:00 +00:00'),
              ('C6', 20260104, '2026-01-01 12:00:00 +00:00')
          as v(crime_id, report_date_key, ingested_at)
    expect:
      rows:
        - {crime_id: C6, nibrs_key: null, offense_date_key: 20260101, report_date_key: 20260105, ingested_at: '2026-01-03 12:00:00 +00:00'}
        - {crime_id: C7, nibrs_key: N1, offense_date_key: 20260101, report_date_key: null, ingested_at: '2026-01-03 12:00:00 +00:00'}
